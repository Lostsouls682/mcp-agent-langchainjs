<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/toms-playground-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tom's Playground burger order board — follow orders from preparation to pickup." />
    <title>Tom's Playground — Burger Orders</title>
    <style>
      :root { --burger-primary: #6554db; --burger-border-radius: 16px; color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; min-height: 100%; font: 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif; background: #f7f8fc; color: #191d30; }
      body { min-height: 100dvh; display: flex; flex-direction: column; }
      header { background: #191d30; color: white; border-bottom: 1px solid #30364e; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .brand { display: flex; align-items: center; gap: 12px; color: #bdb4ff; }
      .brand svg { width: 44px; height: 44px; flex-shrink: 0; }
      .wordmark { font-size: 26px; font-weight: 300; line-height: 1.05; }
      .wordmark small { display: block; font-size: 16px; }
      .header-label { font-size: 14px; color: #dedaf7; }
      main { flex: 1; min-width: 0; }
      @media (max-width: 480px) { header { padding: 12px 16px; } .wordmark { font-size: 22px; } .header-label { max-width: 90px; text-align: right; } }
    </style>
  </head>
  <body>
    <header>
      <div class="brand" aria-label="Tom's Playground">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M4 18 44 4 31 44 23 27 4 18Z" fill="#7b6cff"/><path d="m23 27 21-23-27 18" stroke="#bdb4ff" stroke-width="2"/></svg>
        <span class="wordmark"><small>Tom's</small>Playground</span>
      </div>
      <span class="header-label">Burger order board</span>
    </header>
    <main aria-label="Burger orders"><playground-burger-dashboard></playground-burger-dashboard></main>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
