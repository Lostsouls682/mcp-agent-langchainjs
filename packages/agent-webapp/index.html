<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Tom's Playground AI chat — explore the burger menu and place orders with Playground Assistant." />
    <link rel="icon" type="image/svg+xml" href="/assets/toms-playground-icon.svg" />
    <title>Tom's Playground — AI Chat</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <nav aria-label="Main navigation">
      <a class="brand" href="/" aria-label="Tom's Playground home">
        <img class="brand-wordmark" src="/assets/toms-playground-logo.svg" alt="Tom's Playground" width="300" height="72" />
        <img class="brand-icon" src="/assets/toms-playground-icon.svg" alt="Tom's Playground" width="48" height="48" />
      </a>
      <div class="spacer"></div>
      <azc-auth type="guard"><azc-user-card></azc-user-card></azc-auth>
      <azc-auth type="status"></azc-auth>
    </nav>
    <main>
      <azc-auth>
        <azc-history id="chatHistory"></azc-history>
        <sleek-chat id="chat"></sleek-chat>
      </azc-auth>
    </main>
    <script type="module" src="/src/index.ts"></script>
    <script type="module">
      import '/src/components/sleek-chat.ts';
      import { initUserSession, chatDefaultOptions } from '/src/index.ts';
      const chat = document.getElementById('chat');
      chat.options = {
        ...chatDefaultOptions,
        strings: {
          ...chatDefaultOptions.strings,
          assistant: 'Playground Assistant',
          promptSuggestionsTitle: 'Explore the menu, customize your burger, or let me help you order.',
        },
      };
      await initUserSession();
    </script>
  </body>
</html>
